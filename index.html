</section></main><footer class="wrap footer"><span>© <span>2026</span> Selina Duan · Made with care (and a little help from Tangyuan).</span><span>Stories, strategy & small details</span></footer><script>const menu=document.querySelector(".menu"),nav=document.querySelector(".nav");if(menu&&nav){menu.addEventListener("click",()=>{const open=nav.classList.toggle("open");menu.setAttribute("aria-expanded",open);menu.textContent=open?"×":"☰"});nav.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{nav.classList.remove("open");menu.setAttribute("aria-expanded","false");menu.textContent="☰"}))}</script><script>
const menu=document.querySelector('.menu'),nav=document.querySelector('.nav');menu.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',open);menu.textContent=open?'×':'☰'});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.textContent='☰'}));
const map=document.querySelector('#travelMap'),traveler=document.querySelector('#traveler'),message=document.querySelector('#mapMessage');let px=15,py=62,moveTimer;
let facing=1,turning=false,turnTimer,queuedMove=null;
function boundedPosition(x,y){const mapBox=map.getBoundingClientRect(),actorBox=traveler.getBoundingClientRect();const halfX=actorBox.width/2/mapBox.width*100,halfY=actorBox.height/2/mapBox.height*100;return {x:Math.max(halfX+1,Math.min(100-halfX-1,x)),y:Math.max(halfY+1,Math.min(100-halfY-1,y))}}
function applyMove(x,y){const pos=boundedPosition(x,y);px=pos.x;py=pos.y;traveler.style.left=px+'%';traveler.style.top=py+'%';traveler.classList.add('moving');clearTimeout(moveTimer);moveTimer=setTimeout(()=>traveler.classList.remove('moving'),380)}
function setPos(x,y,dx=0){const nextFacing=dx<0?-1:dx>0?1:facing;if(turning){queuedMove={x,y,nextFacing};return}if(nextFacing!==facing){turning=true;traveler.classList.add(nextFacing<0?'turning-left':'turning-right');turnTimer=setTimeout(()=>{traveler.classList.remove('turning-left','turning-right');facing=nextFacing;traveler.classList.toggle('facing-left',facing<0);turning=false;const target=queuedMove||{x,y};queuedMove=null;applyMove(target.x,target.y)},240);return}applyMove(x,y)}
function step(dx,dy){setPos(px+dx,py+dy,dx)}
const keyDirs={ArrowUp:[0,-3],w:[0,-3],W:[0,-3],ArrowDown:[0,3],s:[0,3],S:[0,3],ArrowLeft:[-3,0],a:[-3,0],A:[-3,0],ArrowRight:[3,0],d:[3,0],D:[3,0]};document.addEventListener('keydown',e=>{const d=keyDirs[e.key];if(d&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();step(...d)}});
document.querySelectorAll('.map-controls button').forEach(b=>b.addEventListener('click',()=>{const d=b.dataset.dir;step(d==='left'?-4:d==='right'?4:0,d==='up'?-4:d==='down'?4:0)}));
map.addEventListener('click',e=>{if(e.target.closest('.map-hotspot,.map-controls'))return;const r=map.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;setPos(x,y,x<px?-1:1)});
document.querySelectorAll('.map-hotspot').forEach(b=>b.addEventListener('click',()=>{const x=Number(b.dataset.x),y=Number(b.dataset.y);setPos(x,y,x<px?-1:1);message.textContent=b.dataset.title+' · Let’s explore';message.classList.add('show');setTimeout(()=>{message.classList.remove('show');window.location.assign(b.dataset.href)},650)}));
const startPos=boundedPosition(px,py);px=startPos.x;py=startPos.y;traveler.style.left=px+'%';traveler.style.top=py+'%';
</script></body></html>
